spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
logging.level.org.springframework.security=DEBUG
# DEBUG сильно замедляет массовые операции (settle, gameweek recalc). Для локальной отладки Mongo — application-dev.properties.
logging.level.org.springframework.data.mongodb.core=WARN
logging.level.net.friendly_bets.matchschedule=INFO
server.port=8080
app.root-redirect-url=swagger-ui.html
# Сессия и cookie JSESSIONID (~2 года). 63072000 с = 730 дней.
server.servlet.session.timeout=730d
server.servlet.session.cookie.max-age=63072000
app.security.remember-me.key=${REMEMBER_ME_KEY:friendly-bets-remember-me-dev}
app.security.remember-me.token-validity-seconds=63072000
match-result-sync.auto-settle-enabled=true
match-result-sync.polling-interval-ms=300000
match-result-sync.default-season=2025
# Пусто — первый ADMIN в БД (см. MatchFinalizeOrchestrator.resolveSystemModeratorId)
match-result-sync.system-moderator-id=
match-result-sync.full-match-initial-delay-ms=300000
match-result-sync.full-match-retry-delay-ms=300000
match-result-sync.full-match-hourly-delay-ms=3600000
# ----- External data layers (defaults; runtime toggles in app_settings / admin) -----
external-data.layers.SCHEDULE.enabled=true
external-data.layers.ODDS.enabled=true
external-data.layers.LIVE.enabled=true
external-data.layers.FULL_MATCH.enabled=true
external-data.odds.refresh-within-hours=36
